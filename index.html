<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>丛林村落 · 探索</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1a0f;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    canvas { display: block; position: fixed; inset: 0; z-index: 0; }
    #hud { z-index: 5; }
    #hud {
      position: fixed; left: 18px; top: 18px; color: #eaf5e0;
      background: rgba(10, 26, 14, 0.5); backdrop-filter: blur(7px);
      padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.95;
      pointer-events: none; border: 1px solid rgba(190, 230, 160, 0.15);
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    #hud b { color: #c8ea92; font-weight: 600; }
    #hud .t { font-size: 11px; color: #9fbd8c; margin-bottom: 5px; letter-spacing: .16em; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(circle at 50% 40%, #24381f 0%, #0c180e 72%);
      color: #cfe8a9; font-size: 14px; letter-spacing: .08em; z-index: 10;
      transition: opacity .7s ease;
    }
    #title { font-size: 21px; letter-spacing: .34em; color: #dcf0bb; margin-bottom: -4px; }
    #bar { width: 260px; height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
    #bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#8fc95d,#cdea9a); transition: width .3s ease; }
    #stat { position: fixed; right: 18px; bottom: 14px; color: rgba(220,240,200,.45);
      font-size: 11px; font-family: Consolas, monospace; pointer-events: none; }
    #err { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; overflow: auto;
      background: rgba(120, 20, 20, .92); color: #ffe9e9; font: 12px/1.6 Consolas, monospace;
      padding: 10px 14px; white-space: pre-wrap; display: none; z-index: 99; }
    #dbg { position: fixed; left: 18px; bottom: 14px; color: rgba(220,240,200,.55);
      font: 11px/1.6 Consolas, monospace; pointer-events: none; white-space: pre; }
    #enterBtn { position: fixed; left: 50%; bottom: 54px; transform: translateX(-50%);
      display: none; z-index: 8; border: 1px solid rgba(220,240,190,.5); border-radius: 999px;
      padding: 12px 24px; color: #f2f7e8; background: rgba(25,48,26,.88);
      font: 600 15px "Microsoft YaHei", sans-serif; letter-spacing: .08em;
      box-shadow: 0 8px 26px rgba(0,0,0,.32); touch-action: manipulation; }
    #enterBtn:active { background: rgba(60,86,43,.96); }
    @media (max-width: 700px) {
      #hud { left: 10px; top: 10px; padding: 8px 11px; font-size: 11px; }
      #hud .t { margin-bottom: 2px; }
      #dbg { display: none; }
      #enterBtn { bottom: 34px; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div id="title">丛 林 村 落</div>
    <div id="msg">正在载入真实丛林资产…</div>
    <div id="bar"><i></i></div>
  </div>

  <div id="hud">
    <div class="t">操 作</div>
    <div><b>W A S D</b> 行走 · <b>Shift</b> 奔跑</div>
    <div><b>鼠标拖动</b> 环视 · <b>滚轮</b> 远近</div>
    <div><b>E / 门口按钮</b> 进入或离开小屋</div>
  </div>
  <button id="enterBtn" type="button">进入小屋</button>
  <div id="stat"></div>
  <div id="dbg"></div>
  <div id="err"></div>

  <script>
    (function () {
      const errEl = document.getElementById('err');
      function show(msg) {
        errEl.style.display = 'block';
        errEl.textContent += msg + '\n';
      }
      window.__showErr = show;
      window.addEventListener('error', e => {
        show('[error] ' + (e.message || e.error) + (e.filename ? ' @' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', e => {
        show('[promise] ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
      });
      // 标记脚本未执行（首次加载 50MB 资产在手机上可能较慢，留足时间）
      setTimeout(() => {
        if (!window.__world) {
          window.__initWarning = true;
          show('[诊断] 脚本尚未完成初始化（可能仍在加载资产或已报错）');
        }
      }, 90000);
    })();
  </script>

  <script type="importmap">
  { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from './vendor/three/loaders/GLTFLoader.js';
    import { RoomEnvironment } from './vendor/three/environments/RoomEnvironment.js';

    // ==================== 世界参数 ====================
    const WORLD_RADIUS = 52;
    const HOUSE_WIDTH = 8;
    const HOUSE_DEPTH = 7;
    const HERO_HEIGHT = 1.15;
    const WALK_SPEED = 3.3;
    const RUN_SPEED = 7.0;

    const HOUSE_SPOTS = [
      { x: -19, z: -14, rot: 0.55, s: 1.00, clear: 12 },
      { x:  17, z: -12, rot: -0.48, s: 0.92, clear: 11 },
      { x:   2, z:  20, rot: 2.15, s: 1.08, clear: 13 },
      { x: -22, z:  17, rot: 1.15, s: 0.88, clear: 11 },
    ];

    // ==================== 渲染器 ====================
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.90;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    // 用户要求：不要雾，画面清晰。此处仅作为天空地平线颜色使用
    const FOG_COLOR = new THREE.Color(0xd4e4ec);
    scene.fog = null;

    // 远裁剪面必须大于天空球半径(400)，否则天空会被裁掉显示为黑
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.3, 700);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.08).texture;

    // ==================== 天空 ====================
    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(400, 32, 20),
      new THREE.ShaderMaterial({
        side: THREE.BackSide, depthWrite: false,
        uniforms: {
          top: { value: new THREE.Color(0x5c9fd6) },
          mid: { value: new THREE.Color(0xc3dbe8) },
          bottom: { value: FOG_COLOR.clone() },
        },
        vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
        fragmentShader: `
          varying vec3 vP; uniform vec3 top; uniform vec3 mid; uniform vec3 bottom;
          void main(){
            float h = normalize(vP).y;
            vec3 c = mix(bottom, mid, smoothstep(-0.04, 0.17, h));
            c = mix(c, top, smoothstep(0.17, 0.75, h));
            gl_FragColor = vec4(c, 1.0);
          }`,
      })
    );
    scene.add(sky);

    // ==================== 灯光 ====================
    scene.add(new THREE.HemisphereLight(0xbcd8ff, 0x40502a, 0.72));
    const sun = new THREE.DirectionalLight(0xfff1d4, 1.65);
    sun.position.set(48, 74, 34);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    sun.shadow.camera.left = -68; sun.shadow.camera.right = 68;
    sun.shadow.camera.top = 68; sun.shadow.camera.bottom = -68;
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 220;
    sun.shadow.bias = -0.0006;
    sun.shadow.normalBias = 0.035;
    scene.add(sun);

    // ==================== 地形高度 ====================
    function smoothstep(a, b, x) {
      const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }
    // 坐标→稳定伪随机（给地面顶点色用，打断贴图 repeat 合成感）
    function hashNoise(x, y) {
      let h = Math.imul((x | 0) ^ (y | 0), 374761393);
      h = Math.imul(h ^ (h >>> 13), 668265263);
      h ^= h >>> 16;
      return ((h >>> 0) & 0xffffffff) / 4294967296;
    }
    function baseHeight(x, z) {
      return Math.sin(x * 0.032) * Math.cos(z * 0.037) * 0.55
           + Math.sin((x + z) * 0.019) * 0.4
           + Math.cos((x - z) * 0.045) * 0.26;
    }
    function terrainHeight(x, z) {
      let flat = 0;
      for (const p of HOUSE_SPOTS) {
        const d = Math.hypot(x - p.x, z - p.z);
        flat = Math.max(flat, 1 - smoothstep(p.clear * 0.5, p.clear * 1.3, d));
      }
      flat = Math.max(flat, 1 - smoothstep(4, 16, Math.hypot(x, z)));
      return baseHeight(x, z) * (1 - flat * 0.95);
    }

    // ==================== 随机 ====================
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20261116);

    // ==================== 加载 ====================
    const loader = new GLTFLoader();
    const texLoader = new THREE.TextureLoader();
    const barEl = document.querySelector('#bar > i');
    const msgEl = document.getElementById('msg');
    const dbgEl = document.getElementById('dbg');
    let done = 0, total = 0;
    function dbg(t) { if (dbgEl) dbgEl.textContent = t; }
    function tick(label) {
      done++;
      barEl.style.width = Math.round(done / total * 100) + '%';
      if (label) msgEl.textContent = label;
      dbg('加载中 ' + done + '/' + total + '  ' + (label || ''));
      document.title = '丛林村落 | 载入 ' + done + '/' + total;
    }
    function loadGLTF(url, label) {
      return new Promise((res, rej) =>
        loader.load(url, g => { tick(label); res(g); }, undefined,
          e => rej(new Error(label + ' 加载失败')))
      );
    }
    function loadTex(url) {
      return new Promise((res, rej) => texLoader.load(url, res, undefined, () => rej(new Error(url))));
    }

    const J = './assets/jungle/';
    // 真实扫描植被（CC0，Poly Haven，去塑料感）
    const ASSETS = [
      { key: 'canopy', url: J + 'shrub_04/shrub_04_lod.glb',               label: '阔叶灌木…' },
      { key: 'shrub3', url: J + 'shrub_03/shrub_03_lod.glb',               label: '灌木…' },
      { key: 'fern',   url: J + 'fern_02/fern_02_lod.glb',                 label: '蕨类…' },
      { key: 'grass',  url: J + 'grass_medium_02/grass_medium_02_lod.glb', label: '草丛…' },
      { key: 'rock1',  url: J + 'rock_07/rock_07_1k.gltf',                 label: '岩石…' },
      { key: 'rock2',  url: J + 'rock_09/rock_09_1k.gltf',                 label: '岩石…' },
      { key: 'moss',   url: J + 'moss_01/moss_01_1k.gltf',                 label: '苔藓…' },
      { key: 'house',  url: './assets/cabin/cabin_exterior.glb',            label: '落地木屋…' },
      { key: 'interior', url: './assets/cabin/cabin_interior.glb',          label: '木屋室内…' },
      { key: 'tree',   url: J + 'island_tree_02/island_tree_02_lod.glb',   label: '热带乔木…' },
      { key: 'hero',   url: J + 'Soldier.glb',                             label: '角色…' },
    ];
    total = ASSETS.length + 1;

    // ==================== 通用材质处理 ====================
    function tuneMaterials(root, opts = {}) {
      root.traverse(o => {
        if (!o.isMesh) return;
        o.castShadow = opts.cast !== false;
        o.receiveShadow = true;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (!m) continue;
          if ('envMapIntensity' in m) m.envMapIntensity = opts.env || 0.55;
          if (m.isMeshStandardMaterial) {
            m.metalness = 0;
            m.roughness = Math.min(1, (m.roughness === undefined ? 0.9 : m.roughness) * 1.02 + 0.03);
          }
        }
      });
    }

    function prepareFoliage(root, tint, leafOnly = false) {
      root.traverse(o => {
        if (!o.isMesh) return;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        const clones = mats.map(m => {
          const c = m.clone();
          const isLeaf = /leaf|leaves|foliage/i.test(c.name || '');
          if (!leafOnly || isLeaf) c.color.set(tint);
          c.envMapIntensity = 0.38;
          c.roughness = 0.94;
          if (c.transparent || c.alphaTest > 0 || (leafOnly && isLeaf)) {
            c.transparent = false;
            c.alphaTest = isLeaf ? 0.32 : Math.max(c.alphaTest || 0, 0.2);
            c.depthWrite = true;
          }
          return c;
        });
        o.material = Array.isArray(o.material) ? clones : clones[0];
        o.castShadow = false;
        o.receiveShadow = true;
      });
    }

    function fitHeight(obj, targetH) {
      const b = new THREE.Box3().setFromObject(obj);
      const s = new THREE.Vector3(); b.getSize(s);
      if (s.y > 0.0001) obj.scale.multiplyScalar(targetH / s.y);
      return obj;
    }

    // ==================== 地面 ====================
    function buildGround(diff, nor, rough) {
      const geo = new THREE.PlaneGeometry(320, 320, 180, 180);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        pos.setZ(i, terrainHeight(pos.getX(i), -pos.getY(i)));
      }
      // 顶点色：大块苔绿斑 + 细碎深浅变化，打断贴图 repeat 的合成感
      const colors = new Float32Array(pos.count * 3);
      for (let i = 0; i < pos.count; i++) {
        const px = pos.getX(i), pz = -pos.getY(i);
        const n = (hashNoise(px * 0.06 + 99, pz * 0.06 + 17) - 0.5) * 0.4;
        const g = smoothstep(-0.35, 0.55,
          Math.sin(px * 0.07) * Math.cos(pz * 0.055) * 0.75
          + (hashNoise(px * 0.014, pz * 0.014) - 0.5) * 1.1);
        const tint = 1 - g * 0.26;                 // 明暗/干湿斑块，打散平铺重复感
        colors[i * 3 + 0] = (0.96 + n * 0.28) * tint;
        colors[i * 3 + 1] = (1.00 + n * 0.30) * tint * 1.01;
        colors[i * 3 + 2] = (0.93 + n * 0.26) * tint;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      for (const t of [diff, nor, rough]) {
        if (!t) continue;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        // 26 次重复 = 320 米地面每张约 12 米，颗粒细节够、重复感被顶点色打散
        t.repeat.set(26, 26);
        t.anisotropy = renderer.capabilities.getMaxAnisotropy();
      }
      if (diff) diff.colorSpace = THREE.SRGBColorSpace;

      const mat = new THREE.MeshStandardMaterial({
        map: diff || null,
        normalMap: nor || null,
        roughnessMap: rough || null,
        roughness: 1, metalness: 0,
        vertexColors: true, color: 0xa2b885,
      });
      if (nor) mat.normalScale = new THREE.Vector2(0.7, 0.7);

      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = -Math.PI / 2;
      m.receiveShadow = true;
      scene.add(m);
    }

    // ==================== 落地木屋 + 独立室内 ====================
    const houseColliders = [];
    const HOUSE_WALL = 0.24;
    let activeHouse = null, nearbyHouse = null;
    const enterBtn = document.getElementById('enterBtn');

    function housePoint(h, lx, lz) {
      return {
        x: h.cx + h.cos * lx + h.sin * lz,
        z: h.cz - h.sin * lx + h.cos * lz,
      };
    }
    function placeHouses(exteriorTemplate, interiorTemplate) {
      HOUSE_SPOTS.forEach((p, index) => {
        const floorY = terrainHeight(p.x, p.z) + 0.02;
        const exterior = exteriorTemplate.clone(true);
        exterior.name = 'JungleHouse_' + (index + 1);
        exterior.scale.setScalar(p.s);
        exterior.rotation.y = p.rot;
        exterior.position.set(p.x, floorY, p.z);
        tuneMaterials(exterior, { env: 0.6 });
        scene.add(exterior);

        const interior = interiorTemplate.clone(true);
        interior.name = 'JungleInterior_' + (index + 1);
        interior.scale.setScalar(p.s);
        interior.rotation.y = p.rot;
        interior.position.set(p.x, floorY, p.z);
        interior.visible = false;
        tuneMaterials(interior, { env: 0.35 });
        scene.add(interior);

        const lightPos = housePoint({ cx: p.x, cz: p.z, cos: Math.cos(p.rot), sin: Math.sin(p.rot) }, 0, 0);
        const light = new THREE.PointLight(0xffd39a, 32, 13, 2);
        light.position.set(lightPos.x, floorY + 2.9 * p.s, lightPos.z);
        light.visible = false;
        scene.add(light);

        const door = housePoint({ cx: p.x, cz: p.z, cos: Math.cos(p.rot), sin: Math.sin(p.rot) }, 0, (HOUSE_DEPTH / 2 + 0.85) * p.s);
        houseColliders.push({
          cx: p.x, cz: p.z, rot: p.rot, scale: p.s,
          hw: HOUSE_WIDTH * p.s / 2, hd: HOUSE_DEPTH * p.s / 2,
          wall: HOUSE_WALL * p.s,
          cos: Math.cos(p.rot), sin: Math.sin(p.rot), floorY,
          exterior, interior, light, doorX: door.x, doorZ: door.z,
          obstacles: [
            { x: 1.45, z: -0.55, hw: 1.16, hd: 0.73 },
            { x: -2.22, z: -1.55, hw: 1.18, hd: 1.54 },
            { x: 1.65, z: -3.0, hw: 1.35, hd: 0.38 },
          ],
        });
      });
    }
    function toggleHouse() {
      if (!nearbyHouse || !player) return;
      const h = nearbyHouse;
      const entering = activeHouse !== h;
      if (activeHouse) {
        activeHouse.exterior.visible = true;
        activeHouse.interior.visible = false;
        activeHouse.light.visible = false;
      }
      activeHouse = entering ? h : null;
      h.exterior.visible = !entering;
      h.interior.visible = entering;
      h.light.visible = entering;
      const localZ = entering ? 1.40 : (HOUSE_DEPTH / 2 + 1.35) * h.scale;
      const pos = housePoint(h, 0, localZ);
      player.position.set(pos.x, entering ? h.floorY + 0.13 * h.scale : terrainHeight(pos.x, pos.z), pos.z);
      playerYaw = entering ? h.rot + Math.PI : h.rot;
      camYaw = playerYaw;
      camPitch = entering ? 0.10 : 0.20;
      camDist = entering ? 2.25 : 8.0;
      nearbyHouse = null;
      enterBtn.style.display = 'none';
    }
    enterBtn.addEventListener('click', toggleHouse);

    // ==================== 散布 ====================
    const trunkColliders = [];
    function blockedByWorld(x, z, clearance) {
      for (const p of HOUSE_SPOTS) if (Math.hypot(x - p.x, z - p.z) < 7.4 * p.s + clearance) return true;
      if (Math.hypot(x, z - 7) < 2.8 + clearance) return true;
      return false;
    }
    function nearTrunk(x, z, d) {
      for (const t of trunkColliders) if (Math.hypot(x - t.x, z - t.z) < d) return true;
      return false;
    }

    function scatter(template, opts) {
      const {
        count, scaleMin = 1, scaleMax = 1, clearance = 0,
        radiusMin = 7, radiusMax = WORLD_RADIUS - 5,
        castShadow = false, sink = 0.03, avoidTrees = 0,
      } = opts;
      let placed = 0, tries = 0;
      const maxTries = count * 70;
      while (placed < count && tries < maxTries) {
        tries++;
        const a = rng() * Math.PI * 2;
        const r = radiusMin + Math.sqrt(rng()) * (radiusMax - radiusMin);
        const x = Math.cos(a) * r, z = Math.sin(a) * r;
        if (blockedByWorld(x, z, clearance)) continue;
        if (avoidTrees > 0 && nearTrunk(x, z, avoidTrees)) continue;

        const o = template.clone();
        o.scale.multiplyScalar(scaleMin + rng() * (scaleMax - scaleMin));
        o.position.set(x, terrainHeight(x, z) - sink, z);
        o.rotation.y = rng() * Math.PI * 2;
        o.traverse(m => { if (m.isMesh) { m.castShadow = castShadow; m.receiveShadow = true; } });
        scene.add(o);
        placed++;
      }
    }

    // ==================== 完整扫描乔木（树干、分枝、树叶保持原始结构） ====================
    const TREE_SPOTS = [
      { x: -9,  z: -7,  h: 11.5 }, { x: 13,  z: 7,   h: 10.2 },
      { x: -16, z: 13,  h: 12.4 }, { x: 17,  z: -9,  h: 9.6 },
      { x: 1,   z: -23, h: 11.0 }, { x: -21, z: 2,   h: 9.2 },
      { x: 26,  z: 18,  h: 10.8 }, { x: -6,  z: 20,  h: 11.8 },
      { x: 30,  z: -26, h: 10.0 }, { x: -32, z: -30, h: 9.4 },
      { x: 8,   z: 33,  h: 12.0 }, { x: -34, z: 8,   h: 10.6 },
      { x: 44,  z: 30,  h: 10.4 }, { x: -45, z: -12, h: 11.2 },
      { x: 20,  z: 44,  h: 9.8 },  { x: -18, z: 46,  h: 10.6 },
      { x: 48,  z: -6,  h: 11.6 }, { x: -50, z: 34,  h: 10.0 },
      { x: 34,  z: -38, h: 11.4 }, { x: -40, z: -44, h: 10.2 },
      { x: 58,  z: 10,  h: 11.0 }, { x: -58, z: -30, h: 9.6 },
      { x: 12,  z: -40, h: 10.8 }, { x: -12, z: -46, h: 11.6 },
      { x: 38,  z: 52,  h: 10.4 }, { x: -30, z: 58,  h: 11.2 },
      { x: 62,  z: 44,  h: 9.8 },  { x: -62, z: 20,  h: 10.6 },
      { x: 24,  z: 10,  h: 11.8 }, { x: -24, z: -8,  h: 10.0 },
      { x: 6,   z: 50,  h: 11.4 }, { x: -8,  z: -32, h: 10.8 },
    ];
    for (const t of TREE_SPOTS) { t.x *= 0.68; t.z *= 0.68; }
    TREE_SPOTS.push(
      { x: 7,   z: -6,  h: 12.5 }, { x: -8,  z: 9,   h: 11.0 },
      { x: 14,  z: 10,  h: 12.0 }, { x: -9,  z: -4,  h: 10.6 },
      { x: 4,   z: -16, h: 11.8 }, { x: -6,  z: 8,   h: 12.2 },
      { x: 18,  z: 2,   h: 10.4 }, { x: -15, z: -1,  h: 11.2 },
    );
    // 房屋、门口与出生视野保留空地，外围补足成片密林
    for (let i = TREE_SPOTS.length - 1; i >= 0; i--) {
      const t = TREE_SPOTS[i];
      const nearHouse = HOUSE_SPOTS.some(p => Math.hypot(t.x - p.x, t.z - p.z) < 7.4);
      const blocksView = t.z > 5 && t.z < 20 && Math.abs(t.x - 2) < 4.6;
      if (nearHouse || blocksView || Math.hypot(t.x, t.z - 7) < 4.5) TREE_SPOTS.splice(i, 1);
    }
    let treeTries = 0;
    while (TREE_SPOTS.length < 72 && treeTries++ < 1600) {
      const a = rng() * Math.PI * 2;
      const r = 16 + rng() * 38;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (HOUSE_SPOTS.some(p => Math.hypot(x - p.x, z - p.z) < 8.0)) continue;
      if (TREE_SPOTS.some(t => Math.hypot(x - t.x, z - t.z) < 3.8)) continue;
      TREE_SPOTS.push({ x, z, h: 9.5 + rng() * 3.8 });
    }

    function buildTrees(treeTemplate) {
      const tpl = treeTemplate.clone(true);
      prepareFoliage(tpl, 0xc2d3a6, true);
      tpl.updateMatrixWorld(true);
      const tplMeshes = [];
      tpl.traverse(o => { if (o.isMesh && o.geometry && o.material) tplMeshes.push(o); });
      const bbox = new THREE.Box3().setFromObject(tpl);
      const size = new THREE.Vector3(); bbox.getSize(size);
      const templateH = size.y || 1;
      const normalization = new THREE.Matrix4()
        .makeTranslation(0, -bbox.min.y / templateH, 0)
        .multiply(new THREE.Matrix4().makeScale(1 / templateH, 1 / templateH, 1 / templateH));
      const dummy = new THREE.Object3D();
      const tmpMat = new THREE.Matrix4();
      const ims = tplMeshes.map(mesh => {
        const leaf = /leaf|leaves|foliage/i.test(mesh.material.name || '');
        const trunk = (mesh.material.name || '') === 'island_tree_02';
        const im = new THREE.InstancedMesh(mesh.geometry, mesh.material, TREE_SPOTS.length);
        im.castShadow = trunk;
        im.receiveShadow = true;
        im.userData.isLeaf = leaf;
        scene.add(im);
        return im;
      });
      for (let i = 0; i < TREE_SPOTS.length; i++) {
        const { x, z, h } = TREE_SPOTS[i];
        const width = 0.64 + rng() * 0.14;
        dummy.position.set(x, terrainHeight(x, z) - 0.035, z);
        dummy.rotation.set(0, rng() * Math.PI * 2, 0);
        dummy.scale.set(h * width, h, h * width);
        dummy.updateMatrix();
        for (let m = 0; m < ims.length; m++) {
          tmpMat.multiplyMatrices(dummy.matrix, normalization).multiply(tplMeshes[m].matrixWorld);
          ims[m].setMatrixAt(i, tmpMat);
        }
        trunkColliders.push({ x, z, r: 0.18 + h * width * 0.045 });
      }
      for (const im of ims) {
        im.instanceMatrix.needsUpdate = true;
        im.computeBoundingSphere();
      }
    }
    // 散布也用 InstancedMesh（shrub1/3/4/fern/grass/moss/rock1/rock2 都各自实例化）
    const SCAT_INST = []; // 每个元素 { ims:[InstancedMesh], list:[{x,z,h,ry,s}], template }
    function scatterInstanced(template, opts) {
      const { count, scaleMin = 1, scaleMax = 1, clearance = 0,
              radiusMin = 7, radiusMax = WORLD_RADIUS - 5, castShadow = false,
              sink = 0, clusterChance = 0 } = opts;
      // 收集模板 mesh，并计算各自局部矩阵（否则多部件植被会被压到同一原点而变形）
      template.updateMatrixWorld(true);
      const tplMeshes = [];
      template.traverse(o => { if (o.isMesh && o.geometry && o.material) tplMeshes.push(o); });
      const ims = [];
      for (const t of tplMeshes) {
        const im = new THREE.InstancedMesh(t.geometry, t.material, count);
        im.castShadow = castShadow; im.receiveShadow = true;
        scene.add(im);
        ims.push(im);
      }
      // 用整个模板的包围盒算缩放基准（不是只看第一个 mesh）
      const dummy = new THREE.Object3D();
      const tmpMat = new THREE.Matrix4();
      const bbox = new THREE.Box3().setFromObject(template);
      const bs = new THREE.Vector3(); bbox.getSize(bs);
      const bY0 = bbox.min.y;
      if (bs.y < 0.0001) { return { ims, placed: 0 }; }
      let placed = 0, tries = 0, maxTries = count * 70;
      while (placed < count && tries < maxTries) {
        tries++;
        let x, z;
        if (trunkColliders.length && rng() < clusterChance) {
          const tree = trunkColliders[Math.floor(rng() * trunkColliders.length)];
          const a = rng() * Math.PI * 2;
          const r = 1.4 + Math.sqrt(rng()) * 5.8;
          x = tree.x + Math.cos(a) * r;
          z = tree.z + Math.sin(a) * r;
          if (Math.hypot(x, z) > WORLD_RADIUS - 3) continue;
        } else {
          const a = rng() * Math.PI * 2;
          const r = radiusMin + Math.sqrt(rng()) * (radiusMax - radiusMin);
          x = Math.cos(a) * r;
          z = Math.sin(a) * r;
        }
        if (blockedByWorld(x, z, clearance)) continue;
        const s = scaleMin + rng() * (scaleMax - scaleMin);
        dummy.position.set(x, terrainHeight(x, z) - sink - bY0 * s, z);
        dummy.scale.setScalar(s);
        dummy.rotation.set(0, rng() * Math.PI * 2, 0);
        dummy.updateMatrix();
        for (let m = 0; m < ims.length; m++) {
          tmpMat.multiplyMatrices(dummy.matrix, tplMeshes[m].matrixWorld);
          ims[m].setMatrixAt(placed, tmpMat);
        }
        placed++;
      }
      for (const im of ims) {
        im.count = placed;
        im.instanceMatrix.needsUpdate = true;
        im.computeBoundingSphere();
      }
      return { ims, placed };
    }

    // ==================== 角色 ====================
    let hero = null, mixer = null, actions = {}, currentAction = null;
    let player = null, playerYaw = Math.PI, heroYawOffset = 0;

    function setupHero(gltf) {
      hero = gltf.scene;
      // 先把 hero 放进场景（临时），让 Three.js 正确应用节点变换，再量真实身高
      scene.add(hero);
      hero.traverse(o => { if (o.isObject3D) o.updateMatrixWorld(true); });
      const bb = new THREE.Box3().setFromObject(hero);
      const bs = new THREE.Vector3(); bb.getSize(bs);
      const curH = bs.y || 1;
      // Soldier.glb 内建缩放后约 0.44m 高，目标 1.8m → 乘 4.09
      hero.scale.multiplyScalar(HERO_HEIGHT / curH);
      // 重新算 bottom，把脚踩 y=0
      hero.updateMatrixWorld(true);
      const bb2 = new THREE.Box3().setFromObject(hero);
      hero.position.y -= bb2.min.y;
      scene.remove(hero);

      hero.traverse(o => {
        if (o.isMesh || o.isSkinnedMesh) {
          o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
          if (o.material) o.material.envMapIntensity = 0.5;
        }
      });

      player = new THREE.Group();
      player.add(hero);
      scene.add(player);
      player.position.set(0, terrainHeight(0, 7), 7);
      camera.position.set(
        player.position.x - Math.sin(camYaw) * camDist,
        player.position.y + 3.0,
        player.position.z - Math.cos(camYaw) * camDist
      );
      camera.lookAt(player.position.x, player.position.y + 1.0, player.position.z);

      mixer = new THREE.AnimationMixer(hero);
      for (const clip of gltf.animations) {
        const n = clip.name.toLowerCase();
        const act = mixer.clipAction(clip);
        if (n.includes('idle')) actions.idle = act;
        else if (n.includes('walk')) actions.walk = act;
        else if (n.includes('run')) actions.run = act;
      }
      if (!actions.walk && gltf.animations.length) actions.walk = mixer.clipAction(gltf.animations[0]);
      if (!actions.idle) actions.idle = actions.walk;
      if (actions.idle) { actions.idle.play(); currentAction = actions.idle; }
    }

    // ==================== NPC（村民） ====================
    let npcs = [];
    function spawnNPC(gl, pos) {
      const root = gl.scene.clone(true);
      scene.add(root);
      // 对齐地面 + 身高缩到 1.65（略矮于玩家 1.8）
      root.updateMatrixWorld(true);
      const bb0 = new THREE.Box3().setFromObject(root);
      const bs0 = new THREE.Vector3(); bb0.getSize(bs0);
      root.scale.multiplyScalar((HERO_HEIGHT * 0.96) / bs0.y);
      root.updateMatrixWorld(true);
      const bb1 = new THREE.Box3().setFromObject(root);
      root.position.y -= bb1.min.y;
      root.position.x = pos.x; root.position.z = pos.z;
      root.position.y += terrainHeight(pos.x, pos.z);
      root.traverse(o => {
        if (o.isMesh || o.isSkinnedMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; }
      });
      const mix = new THREE.AnimationMixer(root);
      const acts = {};
      for (const clip of gl.animations) {
        const n = clip.name.toLowerCase();
        if (n.includes('idle')) acts.idle = mix.clipAction(clip);
        else if (n.includes('walk')) acts.walk = mix.clipAction(clip);
      }
      const state = { pos: pos.clone(), waypoint: null, cooldown: 0, rotY: 0 };
      const npc = { root, mix, acts, state };
      // 随机起始动画
      acts.idle.setEffectiveWeight(1); acts.idle.play();
      npc.current = acts.idle;
      npcs.push(npc);
      return npc;
    }
    function updateNPC(npc, dt) {
      const s = npc.state;
      s.cooldown -= dt;
      if (!s.waypoint || s.cooldown <= 0) {
        // 选下一个目标：别走到树、别靠近房屋、别出界
        let tries = 0;
        while (tries++ < 20) {
          const a = rng() * Math.PI * 2;
          const r = 4 + rng() * 18;
          const tx = s.pos.x + Math.cos(a) * r;
          const tz = s.pos.z + Math.sin(a) * r;
          const blocked = houseColliders.some(c => tx > c.minX - 2 && tx < c.maxX + 2 && tz > c.minZ - 2 && tz < c.maxZ + 2)
            || trunkColliders.some(t => Math.hypot(tx - t.x, tz - t.z) < t.r + 1)
            || Math.hypot(tx, tz) > WORLD_RADIUS - 2;
          if (!blocked) { s.waypoint = new THREE.Vector3(tx, 0, tz); break; }
        }
        s.cooldown = 1.5 + rng() * 2.5;
      }
      const wp = s.waypoint;
      if (wp) {
        const dx = wp.x - s.pos.x, dz = wp.z - s.pos.z;
        const d = Math.hypot(dx, dz);
        if (d < 0.6) { s.waypoint = null; return; }
        const walkSpeed = 1.6;
        s.pos.x += (dx / d) * walkSpeed * dt;
        s.pos.z += (dz / d) * walkSpeed * dt;
        s.rotY = Math.atan2(dx, dz);
      }
      s.pos.y = terrainHeight(s.pos.x, s.pos.z);
      npc.root.position.copy(s.pos);
      // 平滑转身
      let diff = s.rotY - npc.root.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      npc.root.rotation.y += diff * Math.min(1, dt * 6);
      // 动画：移动时走，否则站
      const moving = s.waypoint != null;
      const target = moving ? (npc.acts.walk || npc.acts.idle) : npc.acts.idle;
      if (target && target !== npc.current) {
        target.reset(); target.setEffectiveWeight(1); target.play();
        if (npc.current) target.crossFadeFrom(npc.current, 0.2, false);
        npc.current = target;
      }
      npc.mix.update(dt);
    }

    // ==================== 输入 ====================
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'KeyE' && !e.repeat) toggleHouse();
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });

    let camYaw = 0.08, camPitch = 0.22, camDist = 9.5;
    let dragging = false, lastX = 0, lastY = 0;
    renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    addEventListener('pointerup', () => { dragging = false; });
    addEventListener('pointercancel', () => { dragging = false; });
    addEventListener('pointermove', e => {
      if (!dragging) return;
      camYaw -= (e.clientX - lastX) * 0.0052;
      camPitch = Math.max(-0.02, Math.min(0.92, camPitch + (e.clientY - lastY) * 0.004));
      lastX = e.clientX; lastY = e.clientY;
    });
    addEventListener('wheel', e => {
      const minDist = activeHouse ? 1.35 : 3.2;
      const maxDist = activeHouse ? 3.1 : 14;
      camDist = Math.max(minDist, Math.min(maxDist, camDist + e.deltaY * 0.006));
    }, { passive: true });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ==================== 碰撞 ====================
    const PLAYER_RADIUS = 0.25;
    function resolveCollisions(p) {
      const pr = PLAYER_RADIUS;
      for (const h of houseColliders) {
        const dx = p.x - h.cx, dz = p.z - h.cz;
        let lx = h.cos * dx - h.sin * dz;
        let lz = h.sin * dx + h.cos * dz;
        if (activeHouse === h) {
          // 独立室内：限制在墙内，门口通过 E/按钮切换，不允许穿墙走出去
          const ix = h.hw - h.wall - pr, iz = h.hd - h.wall - pr;
          lx = Math.max(-ix, Math.min(ix, lx));
          lz = Math.max(-iz, Math.min(iz, lz));
          for (const o of h.obstacles) {
            const ox = o.x * h.scale, oz = o.z * h.scale;
            const hw = o.hw * h.scale + pr, hd = o.hd * h.scale + pr;
            const dxo = lx - ox, dzo = lz - oz;
            if (Math.abs(dxo) >= hw || Math.abs(dzo) >= hd) continue;
            const pushX = hw - Math.abs(dxo), pushZ = hd - Math.abs(dzo);
            if (pushX < pushZ) lx = ox + Math.sign(dxo || 1) * hw;
            else lz = oz + Math.sign(dzo || 1) * hd;
          }
          const w = housePoint(h, lx, lz);
          p.x = w.x; p.z = w.z;
        } else {
          // 外部木屋是实心墙体；只有在门口交互后才会切换到独立室内
          if (Math.abs(lx) > h.hw + pr || Math.abs(lz) > h.hd + pr) continue;
          const pushX = h.hw + pr - Math.abs(lx);
          const pushZ = h.hd + pr - Math.abs(lz);
          if (pushX < pushZ) lx = Math.sign(lx || 1) * (h.hw + pr);
          else lz = Math.sign(lz || 1) * (h.hd + pr);
          const w = housePoint(h, lx, lz);
          p.x = w.x; p.z = w.z;
        }
      }
      if (!activeHouse) for (const t of trunkColliders) {
        const dx = p.x - t.x, dz = p.z - t.z;
        const d = Math.hypot(dx, dz);
        const min = t.r + PLAYER_RADIUS;
        if (d < min && d > 0.0001) {
          p.x = t.x + dx / d * min;
          p.z = t.z + dz / d * min;
        }
      }
      const d = Math.hypot(p.x, p.z);
      if (d > WORLD_RADIUS) { p.x *= WORLD_RADIUS / d; p.z *= WORLD_RADIUS / d; }
    }

    function updateInteraction() {
      nearbyHouse = null;
      if (activeHouse) {
        const dx = player.position.x - activeHouse.cx, dz = player.position.z - activeHouse.cz;
        const lx = activeHouse.cos * dx - activeHouse.sin * dz;
        const lz = activeHouse.sin * dx + activeHouse.cos * dz;
        if (Math.abs(lx) < 1.65 * activeHouse.scale && lz > 1.75 * activeHouse.scale) nearbyHouse = activeHouse;
      } else {
        let best = 2.35;
        for (const h of houseColliders) {
          const d = Math.hypot(player.position.x - h.doorX, player.position.z - h.doorZ);
          if (d < best) { best = d; nearbyHouse = h; }
        }
      }
      enterBtn.style.display = nearbyHouse ? 'block' : 'none';
      if (nearbyHouse) enterBtn.textContent = activeHouse ? '走出小屋' : '进入小屋';
    }

    // ==================== 主循环 ====================
    const clock = new THREE.Clock();
    const statEl = document.getElementById('stat');
    const camTarget = new THREE.Vector3();
    let fpsAcc = 0, fpsFrames = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      if (player) {
        const fx = Math.sin(camYaw), fz = Math.cos(camYaw);
        // 屏幕相对方向：右 = 前 × 上 = (-fz, 0, fx)，与角色朝向无关
        const rx = -fz, rz = fx;
        let mx = 0, mz = 0;
        if (keys['KeyW'] || keys['ArrowUp'])    { mx += fx; mz += fz; }
        if (keys['KeyS'] || keys['ArrowDown'])  { mx -= fx; mz -= fz; }
        if (keys['KeyD'] || keys['ArrowRight']) { mx += rx; mz += rz; }
        if (keys['KeyA'] || keys['ArrowLeft'])  { mx -= rx; mz -= rz; }

        const len = Math.hypot(mx, mz);
        const moving = len > 0.001;
        const running = keys['ShiftLeft'] || keys['ShiftRight'];
        const speed = running ? RUN_SPEED : WALK_SPEED;

        if (moving) {
          mx /= len; mz /= len;
          player.position.x += mx * speed * dt;
          player.position.z += mz * speed * dt;
          resolveCollisions(player.position);
          playerYaw = Math.atan2(mx, mz);
        }
        player.position.y = activeHouse
          ? activeHouse.floorY + 0.13 * activeHouse.scale
          : terrainHeight(player.position.x, player.position.z);
        updateInteraction();

        let diff = playerYaw + heroYawOffset - player.rotation.y;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        player.rotation.y += diff * Math.min(1, dt * 12);

        if (mixer) {
          const target = !moving ? actions.idle : (running ? (actions.run || actions.walk) : actions.walk);
          if (target && target !== currentAction) {
            target.reset(); target.setEffectiveWeight(1); target.play();
            if (currentAction) currentAction.crossFadeTo(target, 0.24, false);
            currentAction = target;
          }
          if (currentAction) currentAction.setEffectiveTimeScale(running ? 1.12 : 0.96);
          mixer.update(dt);
        }

        // NPC 村民
        for (const npc of npcs) updateNPC(npc, dt);

        const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
        camTarget.set(
          player.position.x - Math.sin(camYaw) * cp * camDist,
          player.position.y + (activeHouse ? 0.78 : 0.95) + sp * camDist,
          player.position.z - Math.cos(camYaw) * cp * camDist
        );
        if (activeHouse) {
          // 第三人称镜头也留在室内，避免隔墙看到外部或整面墙
          const h = activeHouse;
          const dx = camTarget.x - h.cx, dz = camTarget.z - h.cz;
          let lx = h.cos * dx - h.sin * dz;
          let lz = h.sin * dx + h.cos * dz;
          lx = Math.max(-h.hw + 0.38, Math.min(h.hw - 0.38, lx));
          lz = Math.max(-h.hd + 0.38, Math.min(h.hd - 0.38, lz));
          const w = housePoint(h, lx, lz);
          camTarget.x = w.x; camTarget.z = w.z;
          camTarget.y = Math.max(h.floorY + 0.48, Math.min(h.floorY + 3.65 * h.scale, camTarget.y));
          camera.position.copy(camTarget);
        } else {
          camera.position.lerp(camTarget, Math.min(1, dt * 9));
          const minY = terrainHeight(camera.position.x, camera.position.z) + 0.55;
          if (camera.position.y < minY) camera.position.y = minY;
        }
        camera.lookAt(player.position.x, player.position.y + (activeHouse ? 0.88 : 1.05), player.position.z);
      }

      renderer.render(scene, camera);

      if (!window.__firstFrame) {
        window.__firstFrame = true;
        const info0 = renderer.info.render;
        document.title = '丛林村落 | 首帧OK | tris=' + info0.triangles + ' | calls=' + info0.calls;
      }

      fpsAcc += dt; fpsFrames++;
      if (fpsAcc > 0.5) {
        const fps = Math.round(fpsFrames / fpsAcc);
        statEl.textContent = fps + ' FPS';
        fpsAcc = 0; fpsFrames = 0;
        // 把运行状态写进标题，便于外部取证
        const info = renderer.info.render;
        document.title = '丛林村落 | OK | fps=' + fps + ' | objects=' + scene.children.length
          + ' | tris=' + info.triangles + ' | calls=' + info.calls;
        dbg('fps ' + fps + '  objects ' + scene.children.length + '  三角面 ' + info.triangles);
      }
    }

    // ==================== 启动 ====================
    (async function boot() {
      try {
        msgEl.textContent = '载入地表与真实植被…';

        const safeTex = async url => {
          try { return await loadTex(url); }
          catch (e) { console.warn('贴图缺失，已跳过：', url); return null; }
        };

        // 真实扫描地表（Poly Haven aerial_grass_rock，CC0 可平铺，苔草+碎石丛林地皮）
        const [gDiff, gNor, gRough] = await Promise.all([
          safeTex(J + 'ground/agr_diff.jpg'),
          safeTex(J + 'ground/agr_nor.jpg'),
          safeTex(J + 'ground/agr_arm.jpg'),
        ]);
        tick('地表…');

        const R = {};
        await Promise.all(ASSETS.map(async a => { R[a.key] = await loadGLTF(a.url, a.label); }));

        const stage = t => { document.title = '丛林村落 | 建模 ' + t; dbg('建模 ' + t); };
        stage('地面');
        buildGround(gDiff, gNor, gRough);
        stage('房屋');
        placeHouses(R.house.scene, R.interior.scene);
        stage('树木');

        buildTrees(R.tree.scene);

        stage('植被');

        // 乔木下形成灌木层，蕨类与草丛填空隙；房屋和村口仍保留清晰通路
        prepareFoliage(R.canopy.scene, 0xb9cc9c);
        prepareFoliage(R.shrub3.scene, 0xb5c998);
        prepareFoliage(R.fern.scene, 0xa9c58e);
        prepareFoliage(R.grass.scene, 0xb6cb96);
        prepareFoliage(R.moss.scene, 0xa9bd87);
        scatterInstanced(R.canopy.scene, { count: 48, scaleMin: 2.0, scaleMax: 3.6, clearance: 0.5, radiusMax: 46, clusterChance: 0.8 });
        scatterInstanced(R.shrub3.scene, { count: 280, scaleMin: 1.5, scaleMax: 3.0, clearance: 0.3, radiusMax: 48, clusterChance: 0.78 });
        scatterInstanced(R.fern.scene,    { count: 240, scaleMin: 1.4, scaleMax: 2.6, clearance: 0.2, radiusMin: 3.0, radiusMax: 48, clusterChance: 0.7 });
        scatterInstanced(R.grass.scene,   { count: 340, scaleMin: 1.6, scaleMax: 3.0, clearance: 0.15, radiusMin: 2.5, radiusMax: 47, clusterChance: 0.58 });
        scatterInstanced(R.moss.scene,    { count: 70, scaleMin: 1.0, scaleMax: 2.2, clearance: 0.2, sink: 0.05, radiusMax: 44, clusterChance: 0.5 });
        // 外围高灌木形成真实绿墙；不靠雾遮蔽空旷地平线
        scatterInstanced(R.shrub3.scene,  { count: 140, scaleMin: 4.0, scaleMax: 6.5, clearance: 0.1, radiusMin: 34, radiusMax: 56, clusterChance: 0 });

        scatterInstanced(R.rock1.scene, { count: 14, scaleMin: 0.8, scaleMax: 1.9, clearance: 0.7, castShadow: true });
        scatterInstanced(R.rock2.scene, { count: 12, scaleMin: 0.7, scaleMax: 1.7, clearance: 0.7, castShadow: true });

        stage('角色');
        setupHero(R.hero);

        // 先把已加载贴图上传到 GPU，避免遮罩消失后植被短暂白模
        stage('准备纹理');
        const warmedTextures = new Set();
        const textureSlots = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'alphaMap', 'emissiveMap'];
        scene.traverse(o => {
          if (!o.isMesh) return;
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          for (const mat of mats) for (const slot of textureSlots) {
            const tex = mat && mat[slot];
            if (tex && tex.image && !warmedTextures.has(tex)) {
              renderer.initTexture(tex);
              warmedTextures.add(tex);
            }
          }
        });
        renderer.compile(scene, camera);

        // 慢网络下可能先出现 90 秒诊断；初始化成功后必须撤掉这条误报
        if (window.__initWarning) {
          const errBox = document.getElementById('err');
          errBox.style.display = 'none';
          errBox.textContent = '';
          window.__initWarning = false;
        }

        barEl.style.width = '100%';
        document.title = '丛林村落 | 首帧…';
        const ld = document.getElementById('loading');
        ld.style.opacity = '0';
        setTimeout(() => { ld.style.display = 'none'; }, 700);

        window.__world = {
          ready: true,
          camera, scene, renderer,
          get pos() { return player ? player.position.clone() : null; },
          get anim() { return currentAction ? currentAction.getClip().name : null; },
          get inside() { return activeHouse ? activeHouse.exterior.name : null; },
          get nearDoor() { return nearbyHouse ? nearbyHouse.exterior.name : null; },
          get camState() { return { yaw: camYaw, pitch: camPitch, dist: camDist }; },
          houses: houseColliders,
          setPos(x, z) { if (player) { player.position.x = x; player.position.z = z; } },
          stats() { return { houses: houseColliders.length, trees: trunkColliders.length, inside: activeHouse ? activeHouse.exterior.name : null, fps: statEl.textContent }; },
        };

        animate();
      } catch (err) {
        console.error('[BOOT]', err);
        msgEl.textContent = '加载失败：' + (err && err.message ? err.message : err);
        barEl.style.background = '#c0504d';
        dbg('启动失败');
        document.title = '丛林村落 | FAIL | ' + (err && err.message ? err.message : err).slice(0, 90);
        if (window.__showErr) window.__showErr('[启动] ' + (err && err.stack ? err.stack : err));
      }
    })();
  </script>
</body>
</html>
